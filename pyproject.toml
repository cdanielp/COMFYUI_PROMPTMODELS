[project]
name = "promptmodels"
description = "PromptModels Studio-nodos ComfyUI para NVIDIA NIM, Google Gemini y Grok. Zero SDKs externos, solo REST nativo."
version = "3.0.2"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "PROMPTMODELS Studio" }]
dependencies = ["requests", "Pillow"]

[project.urls]
Repository = "https://github.com/cdanielp/COMFYUI_PROMPTMODELS"
Documentation = "https://github.com/cdanielp/COMFYUI_PROMPTMODELS/wiki"
"Bug Tracker" = "https://github.com/cdanielp/COMFYUI_PROMPTMODELS/issues"

[tool.comfy]
PublisherId = "promptmodelsstudio"
DisplayName = "PromptModels Studio"
Icon = "https://raw.githubusercontent.com/cdanielp/COMFYUI_PROMPTMODELS/main/prompts%20models%20logo.png"
requires-comfyui = ">=0.26.0"
Includes = [
  "__init__.py",
  "core",
  "nodes",
  "legacy",
  "ComfyUI_GoogleAI",
  "ComfyUI_GrokAI",
  "GETSETNODE_PRO",
  "DivisorDePrompts",
  "get_last_frame",
  "text_prompt_blocker",
  "comfyui_selectores_pro",
  "BatchEscenas"
]
